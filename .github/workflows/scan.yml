name: crypto-scan

# 主触发：cron-job.org 外部定时（每 15 分钟调 workflow_dispatch）
# 备用：GitHub 自带 schedule（本仓库上实测不工作，留着当冗余）
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 允许把去重状态提交回来（避免重复推送）
permissions:
  contents: write

# 同一时间只跑一个，防止重叠
concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行市场扫描
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          MIN_VOL: '2000000'
        run: python crypto/cloud_scan.py

      - name: 保存去重状态
        run: |
          set +e
          mkdir -p state
          git config user.name  "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add state/ 2>/dev/null
          if git diff --cached --quiet; then
            echo "状态无变化"
            exit 0
          fi
          git commit -m "state: $(date -u '+%Y-%m-%d %H:%M') UTC"
          # 并发运行时远端可能已更新，重试 3 次并先 rebase
          for i in 1 2 3; do
            git pull --rebase --autostash origin main > /dev/null 2>&1 \
              || git rebase --abort > /dev/null 2>&1
            if git push; then
              echo "OK 状态已保存"
              exit 0
            fi
            echo "第 $i 次推送失败，重试…"
            sleep 4
          done
          echo "WARN 状态推送失败，但不影响本次扫描结果"
          exit 0
