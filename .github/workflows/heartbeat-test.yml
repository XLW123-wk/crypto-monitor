name: heartbeat-test
# 极简测试：每 5 分钟写一行时间戳。用于判断 GitHub 定时触发器本身是否工作。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 写入心跳
        run: |
          echo "heartbeat $(date -u '+%Y-%m-%d %H:%M:%S') UTC" >> heartbeat.log
          git config user.name  "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add heartbeat.log
          git commit -m "heartbeat $(date -u '+%H:%M')"
          git push
